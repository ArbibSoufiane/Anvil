name: release

# Pushing a v<version> tag builds the release with build/publish.ps1 and publishes the zip and SHA256SUMS that
# Settings -> Check for updates looks for.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Check the tag against the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match <Version> $version in Directory.Build.props." }
      - name: Build
        shell: pwsh
        run: ./build/publish.ps1
      - name: Publish on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG "dist/ArbiPache-$version-win64.zip" dist/SHA256SUMS --verify-tag `
            --title "ArbiPache $version" --notes-file dist/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
