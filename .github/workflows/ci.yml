name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Unit tests
        run: |
          dotnet test --project tests/ArbiPache.Core.Tests -c Release --no-build
          dotnet test --project tests/ArbiPache.App.Tests -c Release --no-build
